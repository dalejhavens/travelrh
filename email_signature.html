<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel RH Signature</title>
    <!-- Include Wild Mango and Poppins fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Wild+Mango&family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        .signature-table {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            width: 100%;
            padding: 20px 0; /* Adjust padding as needed */
        }

        .logo, .separator, .text {
            display: flex;
            align-items: center;
        }

        .logo {
            padding-right: 40px; /* Adjust padding as needed */
        }

        .separator {
            width: 1px;
            height: 175px; /* Adjust height as needed */
            background-color: #293d34;
            margin-right: 40px; /* Adjust margin as needed */
        }

        .text {
            flex-direction: column;
            align-items: flex-start;
        }

        h1 {
            font-family: 'Wild Mango', serif; /* Apply Wild Mango font to h1 */
            margin: 0;
            color: #293d34;
        }

        h2, p, a {
            margin: 0;
            color: #293d34;
            font-family: 'Poppins', Arial, sans-serif;
        }

        p {
            margin: 10px 0;
            color: #94a386;
        }

        a {
            text-decoration: none;
            color: #94a386;
        }
    </style>
</head>
<body>
    <table width="100%" border="0" cellspacing="0" cellpadding="0">
        <tr>
            <td align="left" style="padding: 20px;">
                <div class="signature-table">
                    <!-- Logo -->
                    <div class="logo">
                        <img src="https://www.travelrh.com/static/media/Logo_5.png" alt="Logo" width="200" height="auto" />
                    </div>

                    <!-- Separator -->
                    <div class="separator"></div>

                    <!-- Text -->
                    <div class="text">
                        <h1>Rachel Havens</h1>
                        <h2>Travel Advisor</h2>
                        <p>
                            <img src="https://www.travelrh.com/static/media/web.png" style="width: 20px; height: auto; vertical-align: middle; padding-right: .3rem;" /> 
                            <a href="https://www.travelrh.com" target="_blank">www.travelrh.com</a>
                        </p>
                        <p>
                            <img src="https://www.travelrh.com/static/media/ig.png" style="width: 20px; height: auto; vertical-align: middle; padding-right: .3rem;" /> 
                            <a href="https://instagram.com/rachelhavens" target="_blank">@rachelhavens</a>
                        </p>
                    </div>
                </div>
            </td>
        </tr>
    </table>
</body>
</html>
